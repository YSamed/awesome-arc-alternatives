# Builds the site and publishes it to GitHub Pages on every push to main,
# and every 30 minutes so GitHub stars and dates stay fresh.
# One-time setup: Settings › Pages › Source: GitHub Actions.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # Odd minutes, away from :00 and other round times when GitHub queues the most scheduled runs.
    - cron: "13,43 * * * *"
  workflow_dispatch:

# Read-only by default. Only the deploy job gets Pages rights, so the build job
# (and the npm code it runs) never holds a token that can publish the site.
permissions:
  contents: read

# One deployment at a time. A run already deploying finishes; a newer run waits.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Two jobs, like GitHub's Pages template: the deploy job starts only after the
  # build job has finished uploading, so deploy-pages always finds the artifact.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # uses the pnpm version from "packageManager" in package.json
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Writes public/github.json (stars, dates, contributors) for the build to ship.
      # The token goes only to this step: the script has no dependencies, so no
      # third-party npm code can read it. Authenticated, GitHub allows 1,000
      # requests per hour per repo instead of 60 anonymous.
      - run: node scripts/github-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
